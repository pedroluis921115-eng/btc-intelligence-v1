name: Refresh BTC relevant earnings calendar
on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: earnings-calendar-main
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal public API dependency
        run: python -m pip install --disable-pip-version-check "requests>=2.31,<3"
      - name: Update selected companies; keep prior file if source fails
        run: python scripts/update_corporate_calendar.py
      - name: Publish only checked calendar data
        run: |
          git config user.name "btc-intelligence-calendar[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/corporate-calendar.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update verified earnings watchlist [skip ci]"
            git push origin HEAD:main
          fi
